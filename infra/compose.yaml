name: brainsprint
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:?Run infra/setup.sh first}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run infra/setup.sh first}
      POSTGRES_DB: brainsprint
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - brainsprint_pg:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d brainsprint"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  brainsprint_pg:
