# Only permanent Free compute. PostgreSQL is external; no Render database or disk.
services:
  - type: web
    name: brainsprint-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./infra/production/Dockerfile
    dockerContext: .
    # GitHub release operations applies migrations before calling the deploy hook.
    autoDeployTrigger: off
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: verify-full
      - key: PGSSLROOTCERT
        value: /etc/ssl/certs/ca-certificates.crt
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "10080"
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_COOKIE
        value: brainsprint_session
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: CONSUMER_PROXY_SECRET
        sync: false
      - key: PORT
        value: "8080"
